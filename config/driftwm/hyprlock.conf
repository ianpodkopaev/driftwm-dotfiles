# hyprlock config for driftwm — port of ~/.config/hypr/hyprlock.conf.
#
# Why it's not just that file: it does `source = ~/.config/assets/palette/palette.conf`
# (doesn't exist) and points $background_path at ~/.config/hypr/wallpaper_effects/
# (empty), so hyprlock would have no colours and no wallpaper. The palette is
# inlined below from the wallust file the waybar uses, and the background is
# driftwm's own wallpaper.

$font = Adwaita Mono
$background_path = $HOME/Pictures/wallpapers/wallhaven-qrgqyq.jpg

general {
    ignore_empty_input = true
    hide_cursor = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    bezier = linear, 1, 1, 0, 0

    animation = fadeIn, 1, 2.5, linear
    animation = fadeOut, 1, 2.5, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    path = $background_path
    color = rgb(BBBBBa)
    blur_passes = 2
    blur_size = 10
}

input-field {
    size = 25%, 5%
    outline_thickness = 2
    inner_color = rgba(BBBBBAdd)
    outer_color = rgb(66593E)
    check_color = rgb(766A60)
    fail_color = rgb(000000)
    font_color = rgb(66593E)
    fade_on_empty = true
    fade_timeout = 5000
    rounding = 0
    font_family = $font
    placeholder_text = $USER
    fail_text = $PAMFAIL
    dots_text_format = *
    dots_rounding = -1
    dots_size = 0.4
    dots_spacing = 0.6
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    color = rgb(66593E)
    font_size = 64
    font_family = $font
    position = 0, -7%
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(66593E)
    font_size = 16
    font_family = $font
    position = 0, -15%
    halign = center
    valign = top
}
