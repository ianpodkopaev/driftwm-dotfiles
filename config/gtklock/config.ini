[main]
# gtklock config for driftwm — the hyprlock layout from
# ~/.config/hypr/hyprlock.conf, rebuilt with gtklock's widgets.
# style.css is auto-loaded from this dir; palette comes from the waybar's
# wallust file (see style.css).
gtk-theme=Adwaita-dark
time-format=%H:%M
date-format=%A, %d %B
idle-hide=true
idle-timeout=5
